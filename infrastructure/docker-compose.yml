services:
  postgres:
    image: postgres:17-alpine
    container_name: deployforge-postgres
    environment:
      POSTGRES_DB: deployforge
      POSTGRES_USER: deployforge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: deployforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: deployforge
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}"
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
