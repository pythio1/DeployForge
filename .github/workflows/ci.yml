name: DeployForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deployforge_test
          POSTGRES_USER: deployforge
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployforge -d deployforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: deployforge
          RABBITMQ_DEFAULT_PASS: dev_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DeployForge.sln

      - name: Build solution
        run: dotnet build DeployForge.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/DeployForge.UnitTests/DeployForge.UnitTests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/DeployForge.IntegrationTests/DeployForge.IntegrationTests.csproj --configuration Release --no-build
